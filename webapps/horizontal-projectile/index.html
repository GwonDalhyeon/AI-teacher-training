<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>수평 투사 운동</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-sky-50 text-zinc-950">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-5 py-6 sm:px-8">
      <header class="mb-5">
        <p class="text-sm font-semibold text-sky-700">통합과학1 시연</p>
        <h1 class="mt-1 text-3xl font-bold tracking-normal sm:text-4xl">수평 투사 운동</h1>
        <p class="mt-3 max-w-3xl text-base leading-7 text-zinc-700">
          빠르게 던지면 더 빨리 떨어질 것 같지만, 같은 높이에서 출발하면 수평 속력이 달라도 낙하 시간은 같습니다.
        </p>
      </header>

      <section class="grid flex-1 gap-4 lg:grid-cols-[1fr_320px]">
        <div class="rounded-lg border border-sky-200 bg-white p-4 shadow-sm">
          <div class="relative h-[420px] overflow-hidden rounded-md border border-zinc-200 bg-gradient-to-b from-sky-100 to-white">
            <div class="absolute left-0 right-0 bottom-12 h-1 bg-zinc-700"></div>
            <div class="absolute left-8 top-24 h-2 w-24 rounded bg-zinc-600"></div>
            <div class="absolute left-8 top-40 h-2 w-24 rounded bg-zinc-600"></div>
            <div class="absolute left-28 top-[88px] h-5 w-5 rounded-full bg-teal-500 shadow"></div>
            <div class="absolute left-28 top-[152px] h-5 w-5 rounded-full bg-amber-500 shadow"></div>
            <div class="absolute left-6 bottom-4 text-sm font-semibold text-zinc-600">시각화 영역</div>
            <div class="absolute right-5 top-5 rounded-md bg-white/85 px-3 py-2 text-sm font-semibold text-zinc-700 shadow-sm">
              구현 예정: 두 공의 동시 착지 애니메이션
            </div>
          </div>
        </div>

        <aside class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm">
          <h2 class="text-lg font-bold">시연 조작</h2>
          <div class="mt-4 grid grid-cols-3 gap-2">
            <button class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold">느림</button>
            <button class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold">보통</button>
            <button class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold">빠름</button>
          </div>
          <button class="mt-3 w-full rounded-md bg-sky-700 px-4 py-3 text-sm font-bold text-white">동시에 발사</button>

          <dl class="mt-5 space-y-3 text-sm">
            <div class="rounded-md bg-zinc-50 p-3">
              <dt class="font-semibold text-zinc-600">느린 공 낙하 시간</dt>
              <dd class="mt-1 text-xl font-bold">같음</dd>
            </div>
            <div class="rounded-md bg-zinc-50 p-3">
              <dt class="font-semibold text-zinc-600">빠른 공 낙하 시간</dt>
              <dd class="mt-1 text-xl font-bold">같음</dd>
            </div>
            <div class="rounded-md bg-sky-50 p-3">
              <dt class="font-semibold text-sky-800">관찰 포인트</dt>
              <dd class="mt-1 leading-6 text-zinc-700">멀리 가는 정도는 달라도 바닥에 닿는 순간은 같습니다.</dd>
            </div>
          </dl>
        </aside>
      </section>
    </main>
  </body>
</html>
