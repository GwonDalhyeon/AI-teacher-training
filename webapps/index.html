<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연수 시연용 웹앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-50 text-zinc-950">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col px-5 py-8 sm:px-8">
      <header class="mb-8 border-b border-zinc-200 pb-6">
        <p class="text-sm font-semibold text-teal-700">ChatGPT 수업 조언자 만들기</p>
        <h1 class="mt-2 text-3xl font-bold tracking-normal sm:text-4xl">연수 시연용 웹앱</h1>
        <p class="mt-3 max-w-3xl text-base leading-7 text-zinc-700">
          학생이나 타교과 교사도 짧은 시연만으로 핵심 변화를 볼 수 있도록, 조작은 제한하고 결과 변화는 크게 보여주는 수업 도구입니다.
        </p>
      </header>

      <section class="grid gap-4 md:grid-cols-2" aria-label="시연 앱 목록">
        <a
          class="group rounded-lg border border-zinc-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-teal-500 hover:shadow-md"
          href="./horizontal-projectile/"
        >
          <p class="text-sm font-semibold text-zinc-500">통합과학1</p>
          <h2 class="mt-2 text-xl font-bold">수평 투사 운동</h2>
          <p class="mt-3 text-sm leading-6 text-zinc-700">
            빠르게 던져도 더 빨리 떨어지는 것은 아니라는 점을 두 공의 동시 착지로 보여줍니다.
          </p>
          <span class="mt-5 inline-flex text-sm font-semibold text-teal-700 group-hover:text-teal-800">열기</span>
        </a>

        <a
          class="group rounded-lg border border-zinc-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-teal-500 hover:shadow-md"
          href="./electromagnetic-induction/"
        >
          <p class="text-sm font-semibold text-zinc-500">통합과학2</p>
          <h2 class="mt-2 text-xl font-bold">전자기 유도</h2>
          <p class="mt-3 text-sm leading-6 text-zinc-700">
            자석이 가까이 있기만 할 때와 움직일 때의 차이를 전류계 반응으로 보여줍니다.
          </p>
          <span class="mt-5 inline-flex text-sm font-semibold text-teal-700 group-hover:text-teal-800">열기</span>
        </a>
      </section>
    </main>
  </body>
</html>
