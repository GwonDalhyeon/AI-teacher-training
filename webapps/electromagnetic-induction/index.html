<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전자기 유도</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .scene-svg { display: block; width: 100%; height: auto; }
      .magnet-grp { cursor: ew-resize; user-select: none; }
    </style>
  </head>
  <body class="min-h-screen bg-rose-50 text-zinc-950">
    <main class="mx-auto w-full max-w-5xl px-4 py-5">

      <header class="mb-4">
        <div class="flex flex-wrap gap-2 text-sm font-semibold text-rose-700">
          <a href="../">연수 시연용 웹앱</a>
          <span class="text-zinc-400">/</span>
          <span>통합과학2</span>
        </div>
        <h1 class="mt-2 text-3xl font-bold">전자기 유도</h1>
        <p class="mt-2 max-w-2xl text-zinc-700">
          자석이 코일 안에 있어도 <strong>멈추면 전류는 없습니다.</strong>
          코일을 지나는 자기장이 <em>변할 때</em>만 전류가 생깁니다.
        </p>
      </header>

      <div class="mb-3 flex flex-wrap items-center gap-2">
        <button data-preset="slow"  class="preset-btn rounded-md bg-sky-700 px-3 py-2 text-sm font-semibold text-white">천천히 왕복</button>
        <button data-preset="fast"  class="preset-btn rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold text-zinc-800 hover:border-sky-400">빠르게 왕복</button>
        <button data-preset="accel" class="preset-btn rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold text-zinc-800 hover:border-sky-400">가속 왕복</button>
        <button id="btnReset" class="rounded-md border border-zinc-200 px-3 py-2 text-sm text-zinc-600 hover:border-zinc-400">초기화</button>
        <button id="btnCompare" class="ml-auto rounded-md border border-rose-400 px-3 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-100">코일 비교 보기 ↓</button>
      </div>

      <!-- 씬 1 -->
      <div class="mb-2 rounded-xl border border-rose-200 bg-white p-2 shadow-sm">
        <div class="mb-1 flex items-center gap-2 px-1">
          <span class="h-3 w-3 rounded-full bg-orange-400"></span>
          <span class="text-xs font-semibold text-zinc-500">코일 5회</span>
        </div>
        <svg id="scene1" class="scene-svg" viewBox="0 0 800 270"></svg>
      </div>

      <div id="returnHint" class="hidden -mt-1 mb-1 text-right text-xs text-zinc-400 pr-2">← 자석을 왼쪽으로 끌어 되돌리세요</div>

      <!-- 씬 2 (기본 숨김) -->
      <div id="wrap2" class="mb-2 hidden rounded-xl border border-violet-200 bg-white p-2 shadow-sm">
        <div class="mb-1 flex items-center gap-2 px-1">
          <span class="h-3 w-3 rounded-full bg-violet-500"></span>
          <span class="text-xs font-semibold text-zinc-500">코일 10회</span>
        </div>
        <svg id="scene2" class="scene-svg" viewBox="0 0 800 270"></svg>
      </div>

      <!-- 그래프 (단일 캔버스, 두 선 중첩) -->
      <div class="rounded-xl border border-zinc-200 bg-white p-3 shadow-sm">
        <div class="mb-1 flex flex-wrap gap-4 text-xs font-semibold text-zinc-400">
          <span>상대 세기</span>
          <span class="flex items-center gap-1">
            <span class="inline-block rounded bg-slate-400" style="width:18px;height:2px"></span>자석 속도
          </span>
          <span class="flex items-center gap-1">
            <span class="inline-block rounded bg-orange-400" style="width:18px;height:2px"></span>전류 (코일 5회)
          </span>
          <span id="leg2" class="hidden items-center gap-1">
            <span class="inline-block rounded bg-violet-500" style="width:18px;height:2px"></span>전류 (코일 10회)
          </span>
        </div>
        <canvas id="graph1" class="block w-full" height="120"></canvas>
      </div>

      <div class="mt-3 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-zinc-700">
        <strong class="text-amber-800">핵심 관찰</strong>
        — 속도 곡선과 전류 곡선은 같은 형태입니다. 자석이 코일 중앙을 지날 때 전류가 일시적으로 작아집니다. 코일이 많을수록 전류가 큽니다.
      </div>
    </main>

    <script>
    // ── 상수 ────────────────────────────────────────────────────────────────
    const SL = 100, SR = 540, SCY = 135;
    const SW = SR - SL;          // 440px
    const CRY = 30;              // 원통 반지름
    const CRYO = 50;             // 코일 호 반지름 (원통 밖으로 20px 돌출)
    const MW = 88, MH = 32;
    const GCX = 700, GCY = 135, GR = 58;
    const XMIN = 10, XMAX = 760;
    const N1 = 5, N2 = 10;
    const NDOTS = 8;
    const GBUF = 480;
    // 그래프 표시 스케일: 빠른 프리셋 10회 최대 ≈1.55 → 86% 높이
    const GRAPH_SCALE = 1.8;

    // ── 상태 ────────────────────────────────────────────────────────────────
    let magX = XMIN + 10;
    let prevMagX = magX;
    let smoothVel = 0;
    let drag = null;
    let preset = null;
    let comparing = false;
    let lastT = 0;

    const buf = new Float32Array(GBUF * 3); // [smoothVel, cur1_raw, cur2_raw]
    let bHead = 0, lastBufT = 0;

    const phases = [
      Array.from({length: NDOTS}, (_, i) => i / NDOTS),
      Array.from({length: NDOTS}, (_, i) => i / NDOTS),
    ];

    // ── 물리 ────────────────────────────────────────────────────────────────
    function coupling(mx) {
      const dx = (mx - (SL + SR) / 2) / (SW / 2);
      const s = 0.72;
      return -dx * Math.exp(-(dx * dx) / (2 * s * s)) * 2.2;
    }

    function fluxMag(mx) {
      const dx = (mx - (SL + SR) / 2) / (SW / 2);
      const s = 0.62;
      return Math.exp(-(dx * dx) / (2 * s * s));
    }

    // 클램프 없는 원시 전류값 — 그래프에 저장
    function calcCurrentRaw(vel, mx, N) {
      return coupling(mx) * vel * (N / N1);
    }

    // ── SVG 유틸 ────────────────────────────────────────────────────────────
    const NS = 'http://www.w3.org/2000/svg';

    function el(tag, attrs) {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
      return e;
    }

    function txt(parent, str, attrs) {
      const e = el('text', attrs);
      e.textContent = str;
      parent.appendChild(e);
      return e;
    }

    // ── 씬 생성 ─────────────────────────────────────────────────────────────
    function buildScene(svgId, N, sid) {
      const svg = document.getElementById(svgId);
      svg.innerHTML = '';

      const defs = el('defs', {});
      ['r','b'].forEach((c, i) => {
        const m = el('marker', { id: `ar${c}${sid}`, markerWidth:'7', markerHeight:'7', refX:'6', refY:'3.5', orient:'auto' });
        m.appendChild(el('path', { d:'M0,0 L7,3.5 L0,7 Z', fill: i===0 ? '#dc2626' : '#2563eb' }));
        defs.appendChild(m);
      });
      svg.appendChild(defs);

      // 외부 자기장선 그룹 (맨 뒤)
      svg.appendChild(el('g', { id: `ef${sid}` }));

      // 코일: 앞면 "/" 대각선 + 뒷면 "\" 대각선 + 끝점 반원 캡
      const pitch = SW / N;
      const capR = Math.min(7, pitch * 0.14); // 끝점 반원 크기

      // 뒷면 "\" 대각선 — 원통보다 먼저 → 원통이 중간을 덮어 3D 효과
      const backG = el('g', {});
      for (let i = 0; i < N; i++) {
        const x1 = (SL + (i + 0.5) * pitch).toFixed(1);
        const x2 = (SL + (i + 1) * pitch).toFixed(1);
        backG.appendChild(el('line', {
          x1, y1: SCY - CRYO, x2, y2: SCY + CRYO,
          stroke: '#b45309', 'stroke-width': '3',
          'stroke-dasharray': '5,3', opacity: '0.65'
        }));
      }
      svg.appendChild(backG);

      // 원통 몸체 — 뒷면 사선의 가운데를 덮음
      svg.appendChild(el('rect', {
        x: SL, y: SCY - CRY, width: SW, height: CRY * 2, rx: CRY,
        fill: '#fefce8', stroke: '#ca8a04', 'stroke-width': '1.5'
      }));

      // 내부 자기장선 그룹
      svg.appendChild(el('g', { id: `if${sid}` }));

      // 원통 끝면 (3D 감)
      [SL, SR].forEach(cx => {
        svg.appendChild(el('ellipse', {
          cx, cy: SCY, rx: 9, ry: CRY,
          fill: '#fde68a', stroke: '#ca8a04', 'stroke-width': '1.5'
        }));
      });

      // 앞면 "/" 대각선 — 원통 위에 그려짐
      const frontG = el('g', {});
      for (let i = 0; i < N; i++) {
        const x1 = (SL + i * pitch).toFixed(1);
        const x2 = (SL + (i + 0.5) * pitch).toFixed(1);
        frontG.appendChild(el('line', {
          x1, y1: SCY + CRYO, x2, y2: SCY - CRYO,
          stroke: '#b45309', 'stroke-width': '4'
        }));
      }

      // 위쪽 끝점 반원 캡 ("/" 끝 → "\" 시작 연결, 원통 위쪽)
      for (let i = 0; i < N; i++) {
        const cx = (SL + (i + 0.5) * pitch).toFixed(1);
        const cy = SCY - CRYO;
        frontG.appendChild(el('path', {
          d: `M ${+cx - capR} ${cy} A ${capR} ${capR * 0.65} 0 0 0 ${+cx + capR} ${cy}`,
          fill: 'none', stroke: '#b45309', 'stroke-width': '4'
        }));
      }

      // 아래쪽 끝점 반원 캡 ("\" 끝 → 다음 "/" 시작 연결, 원통 아래쪽)
      for (let i = 1; i < N; i++) {
        const cx = (SL + i * pitch).toFixed(1);
        const cy = SCY + CRYO;
        frontG.appendChild(el('path', {
          d: `M ${+cx - capR} ${cy} A ${capR} ${capR * 0.65} 0 0 1 ${+cx + capR} ${cy}`,
          fill: 'none', stroke: '#b45309', 'stroke-width': '4'
        }));
      }

      svg.appendChild(frontG);

      // 전선 (코일 → 검류계)
      const wa = { fill: 'none', stroke: '#374151', 'stroke-width': '2', 'stroke-dasharray': '6,3' };
      svg.appendChild(el('path', { ...wa, d: `M ${SR} ${SCY-CRY-1} Q ${SR+38} ${SCY-82} ${GCX-GR+4} ${GCY-6}` }));
      svg.appendChild(el('path', { ...wa, d: `M ${SR} ${SCY+CRY+1} Q ${SR+38} ${SCY+82} ${GCX-GR+4} ${GCY+6}` }));

      // 검류계
      const gG = el('g', {});
      gG.appendChild(el('circle', { cx: GCX, cy: GCY, r: GR, fill: 'white', stroke: '#374151', 'stroke-width': '2.5' }));
      const sr = GR - 11;
      gG.appendChild(el('path', {
        d: `M ${GCX-sr} ${GCY} A ${sr} ${sr} 0 0 1 ${GCX+sr} ${GCY}`,
        fill: 'none', stroke: '#9ca3af', 'stroke-width': '1.5'
      }));
      for (let a = -80; a <= 80; a += 20) {
        const rad = (a - 90) * Math.PI / 180;
        gG.appendChild(el('line', {
          x1: GCX + (GR-18) * Math.cos(rad), y1: GCY + (GR-18) * Math.sin(rad),
          x2: GCX + (GR-11) * Math.cos(rad), y2: GCY + (GR-11) * Math.sin(rad),
          stroke: '#6b7280', 'stroke-width': a === 0 ? '2' : '1.5'
        }));
      }
      txt(gG, '−', { x: GCX-sr+3,  y: GCY+16, 'text-anchor':'middle', 'font-size':'12', fill:'#2563eb', 'font-weight':'700' });
      txt(gG, '+', { x: GCX+sr-3,  y: GCY+16, 'text-anchor':'middle', 'font-size':'12', fill:'#dc2626', 'font-weight':'700' });
      txt(gG, '0', { x: GCX,       y: GCY-sr+2,'text-anchor':'middle','font-size':'9',  fill:'#9ca3af' });
      txt(gG, 'G', { x: GCX,       y: GCY+GR-6,'text-anchor':'middle','font-size':'11', fill:'#4b5563', 'font-weight':'700' });
      gG.appendChild(el('circle', { cx: GCX, cy: GCY, r: '4', fill: '#374151' }));
      gG.appendChild(el('line', {
        id: `nd${sid}`, x1: GCX, y1: GCY, x2: GCX, y2: GCY - (GR - 14),
        stroke: '#dc2626', 'stroke-width': '2.5', 'stroke-linecap': 'round'
      }));
      svg.appendChild(gG);

      // 전류 도트 그룹
      const dotColor = sid === 1 ? '#f97316' : '#8b5cf6';
      const dG = el('g', { id: `dots${sid}` });
      for (let i = 0; i < NDOTS; i++) {
        dG.appendChild(el('circle', { id: `dot${sid}x${i}`, r: '5', fill: dotColor, opacity: '0' }));
      }
      svg.appendChild(dG);

      // 자석 그룹 (최상위)
      const mG = el('g', { id: `mag${sid}`, class: 'magnet-grp' });
      mG.appendChild(el('rect', { x: -MW/2, y: -MH/2, width: MW/2, height: MH, rx: '4', fill: '#1d4ed8' }));
      mG.appendChild(el('rect', { x: 0,     y: -MH/2, width: MW/2, height: MH, rx: '4', fill: '#dc2626' }));
      txt(mG, 'S', { x: -MW/4, y: '6', 'text-anchor': 'middle', 'font-size': '14', 'font-weight': '800', fill: 'white' });
      txt(mG, 'N', { x:  MW/4, y: '6', 'text-anchor': 'middle', 'font-size': '14', 'font-weight': '800', fill: 'white' });
      svg.appendChild(mG);
    }

    // ── 씬 업데이트 ─────────────────────────────────────────────────────────
    function updateScene(sid, N, mx, cur) {
      const svg = document.getElementById('scene' + sid);
      if (!svg) return;

      svg.querySelector(`#mag${sid}`).setAttribute('transform', `translate(${mx.toFixed(1)},${SCY})`);

      const nd = svg.querySelector(`#nd${sid}`);
      if (nd) {
        const angle = Math.max(-75, Math.min(75, cur * 75));
        const rad = (angle - 90) * Math.PI / 180;
        const len = GR - 14;
        nd.setAttribute('x2', (GCX + len * Math.cos(rad)).toFixed(1));
        nd.setAttribute('y2', (GCY + len * Math.sin(rad)).toFixed(1));
      }

      updateFieldLines(svg, sid, mx, cur);
      updateDots(svg, sid, N, cur);
    }

    function updateFieldLines(svg, sid, mx, cur) {
      const flux = fluxMag(mx);
      const positive = cur >= 0;
      const lineCol = positive ? '#dc2626' : '#2563eb';
      const markerR = `url(#arr${sid})`;
      const markerB = `url(#arb${sid})`;
      const marker = positive ? markerR : markerB;

      const ifG = svg.querySelector(`#if${sid}`);
      ifG.innerHTML = '';
      if (flux > 0.06) {
        for (let i = -1; i <= 1; i++) {
          const y = SCY + i * 11;
          const op = (flux * (i === 0 ? 0.9 : 0.55)).toFixed(2);
          ifG.appendChild(el('line', {
            x1: SL + 16, y1: y, x2: SR - 16, y2: y,
            stroke: lineCol, 'stroke-width': i === 0 ? '2' : '1.5',
            opacity: op, 'marker-end': marker
          }));
        }
      }

      const efG = svg.querySelector(`#ef${sid}`);
      efG.innerHTML = '';
      if (flux > 0.12) {
        const ext = flux * 0.75;
        const h = 44 + flux * 46;
        const loopAttrs = {
          fill: 'none', stroke: lineCol, 'stroke-width': '1.8',
          opacity: (ext).toFixed(2), 'stroke-dasharray': '5,3'
        };
        efG.appendChild(el('path', { ...loopAttrs,
          d: `M ${SL} ${SCY-CRY} Q ${SL-28} ${SCY-CRY-h} ${(SL+SR)/2} ${SCY-CRY-h} Q ${SR+28} ${SCY-CRY-h} ${SR} ${SCY-CRY}`
        }));
        efG.appendChild(el('path', { ...loopAttrs,
          d: `M ${SL} ${SCY+CRY} Q ${SL-28} ${SCY+CRY+h} ${(SL+SR)/2} ${SCY+CRY+h} Q ${SR+28} ${SCY+CRY+h} ${SR} ${SCY+CRY}`
        }));
      }
    }

    function helixPt(t, N) {
      const tt = ((t % 1) + 1) % 1;
      const pitch = SW / N;
      const pos = tt * N;           // 0..N 코일 전체 위치
      const turn = Math.floor(pos);
      const phase = pos - turn;     // 0..1 (한 턴 안의 위치)
      const x0 = SL + turn * pitch;

      if (phase < 0.5) {
        // "/" 앞면: 아래→위
        const p = phase * 2;
        return { x: x0 + p * pitch / 2, y: SCY + CRYO - p * 2 * CRYO, front: true };
      } else {
        // "\" 뒷면: 위→아래
        const p = (phase - 0.5) * 2;
        return { x: x0 + pitch / 2 + p * pitch / 2, y: SCY - CRYO + p * 2 * CRYO, front: false };
      }
    }

    function updateDots(svg, sid, N, cur) {
      const absCur = Math.min(1, Math.abs(cur));
      const speed = absCur * 0.012;
      const dir = cur >= 0 ? 1 : -1;
      const ph = phases[sid - 1];

      for (let i = 0; i < NDOTS; i++) {
        ph[i] = ((ph[i] + speed * dir) % 1 + 1) % 1;
        const dot = svg.querySelector(`#dot${sid}x${i}`);
        if (!dot) continue;
        const p = helixPt(ph[i], N);
        dot.setAttribute('cx', p.x.toFixed(1));
        dot.setAttribute('cy', p.y.toFixed(1));
        if (absCur < 0.02) {
          dot.setAttribute('opacity', '0');
        } else {
          dot.setAttribute('opacity', p.front ? (absCur * 0.9).toFixed(2) : (absCur * 0.2).toFixed(2));
          dot.setAttribute('r', p.front ? '5' : '3');
        }
      }
    }

    // ── 그래프 (단일 캔버스, 비교 시 두 선 중첩) ────────────────────────────
    function drawGraph() {
      const c = document.getElementById('graph1');
      if (!c || !c.parentElement) return;
      const W = c.parentElement.clientWidth || 700;
      if (c.width !== W) c.width = W;
      const H = c.height;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#fafafa';
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = '#e5e7eb';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();

      ctx.fillStyle = '#9ca3af';
      ctx.font = '10px sans-serif';
      ctx.fillText('상대 세기', 4, 14);
      ctx.fillText('시간 →', W - 52, H - 4);

      function line(bufIdx, color, lw) {
        ctx.strokeStyle = color;
        ctx.lineWidth = lw;
        ctx.setLineDash([]);
        ctx.beginPath();
        for (let i = 0; i < GBUF; i++) {
          const idx = (bHead + i) % GBUF;
          const v = buf[idx * 3 + bufIdx] / GRAPH_SCALE;
          const x = (i / (GBUF - 1)) * W;
          const y = H / 2 - v * (H / 2 - 6);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      line(0, '#94a3b8', 1.5);                          // 자석 속도 (slate)
      line(1, '#f97316', 2.5);                          // 전류 5회 (orange)
      if (comparing) line(2, '#8b5cf6', 2.5);          // 전류 10회 (violet)
    }

    // ── 프리셋 ──────────────────────────────────────────────────────────────
    const presetDefs = {
      slow:  { dur: 4200, fn: t => 0.5 - 0.5 * Math.cos(2 * Math.PI * t) },
      fast:  { dur: 1600, fn: t => 0.5 - 0.5 * Math.cos(2 * Math.PI * t) },
      accel: {
        dur: 3000,
        fn: t => t < 0.45
          ? (t / 0.45) * (t / 0.45)
          : (1 - (t - 0.45) / 0.55) * (1 - (t - 0.45) / 0.55)
      }
    };

    function startPreset(name) {
      magX = XMIN + 10;
      prevMagX = magX;
      smoothVel = 0;
      preset = { def: presetDefs[name], startT: null };
    }

    function tickPreset(ts) {
      if (!preset) return;
      if (!preset.startT) preset.startT = ts;
      const t = Math.min((ts - preset.startT) / preset.def.dur, 1);
      magX = XMIN + 10 + (XMAX - XMIN - 20) * preset.def.fn(t);
      if (t >= 1) { preset = null; setActivePreset(null); }
    }

    function setActivePreset(name) {
      document.querySelectorAll('.preset-btn').forEach(btn => {
        const active = btn.dataset.preset === name;
        btn.className = active
          ? 'preset-btn rounded-md bg-sky-700 px-3 py-2 text-sm font-semibold text-white'
          : 'preset-btn rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold text-zinc-800 hover:border-sky-400';
      });
    }

    // ── 드래그 ──────────────────────────────────────────────────────────────
    function svgXfrom(e, svgEl) {
      const rect = svgEl.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      return (cx - rect.left) / rect.width * 800;
    }

    function initDrag(svgId) {
      const svg = document.getElementById(svgId);
      const mG = svg.querySelector('.magnet-grp');
      if (!mG) return;
      const onDown = e => {
        preset = null;
        setActivePreset(null);
        drag = { startSvgX: svgXfrom(e, svg), startMagX: magX };
        e.preventDefault();
      };
      mG.addEventListener('mousedown', onDown);
      mG.addEventListener('touchstart', onDown, { passive: false });
    }

    window.addEventListener('mousemove', e => {
      if (!drag) return;
      const svg = document.getElementById('scene1');
      const dx = svgXfrom(e, svg) - drag.startSvgX;
      magX = Math.max(XMIN, Math.min(XMAX, drag.startMagX + dx));
    });
    window.addEventListener('touchmove', e => {
      if (!drag) return;
      const svg = document.getElementById('scene1');
      const dx = svgXfrom(e, svg) - drag.startSvgX;
      magX = Math.max(XMIN, Math.min(XMAX, drag.startMagX + dx));
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('mouseup',  () => { drag = null; });
    window.addEventListener('touchend', () => { drag = null; });

    // ── 메인 루프 ───────────────────────────────────────────────────────────
    function frame(ts) {
      const dt = Math.min(ts - lastT, 80);
      lastT = ts;

      tickPreset(ts);

      const rawV = dt > 0 ? (magX - prevMagX) / dt : 0;
      smoothVel = smoothVel * 0.65 + rawV * 0.35;
      prevMagX = magX;

      // 원시 전류 (클램프 없음) → 그래프 버퍼에 저장
      const cur1 = calcCurrentRaw(smoothVel, magX, N1);
      const cur2 = calcCurrentRaw(smoothVel, magX, N2);

      // 검류계·도트용 클램프
      const cur1d = Math.max(-1, Math.min(1, cur1));
      const cur2d = Math.max(-1, Math.min(1, cur2));

      updateScene(1, N1, magX, cur1d);
      if (comparing) updateScene(2, N2, magX, cur2d);

      if (ts - lastBufT > 16) {
        buf[bHead * 3]     = smoothVel; // 원시 속도
        buf[bHead * 3 + 1] = cur1;     // 원시 전류 5회
        buf[bHead * 3 + 2] = cur2;     // 원시 전류 10회
        bHead = (bHead + 1) % GBUF;
        lastBufT = ts;
      }

      drawGraph();

      const rHint = document.getElementById('returnHint');
      if (rHint) rHint.classList.toggle('hidden', !(magX >= XMAX - 30 && !preset));

      requestAnimationFrame(frame);
    }

    // ── 초기화 ──────────────────────────────────────────────────────────────
    function init() {
      buildScene('scene1', N1, 1);
      buildScene('scene2', N2, 2);
      initDrag('scene1');
      initDrag('scene2');

      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setActivePreset(btn.dataset.preset);
          startPreset(btn.dataset.preset);
        });
      });

      document.getElementById('btnReset').addEventListener('click', () => {
        preset = null;
        drag = null;
        magX = XMIN + 10;
        prevMagX = magX;
        smoothVel = 0;
        buf.fill(0);
        bHead = 0;
        phases[0].forEach((_, i, a) => { a[i] = i / NDOTS; });
        phases[1].forEach((_, i, a) => { a[i] = i / NDOTS; });
        setActivePreset(null);
      });

      document.getElementById('btnCompare').addEventListener('click', () => {
        comparing = !comparing;
        document.getElementById('wrap2').classList.toggle('hidden', !comparing);
        document.getElementById('leg2').classList.toggle('hidden', !comparing);
        document.getElementById('leg2').classList.toggle('flex', comparing);
        const btn = document.getElementById('btnCompare');
        btn.textContent = comparing ? '비교 숨기기 ↑' : '코일 비교 보기 ↓';
        btn.classList.toggle('bg-rose-100', comparing);
      });

      lastT = performance.now();
      requestAnimationFrame(frame);
    }

    window.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
