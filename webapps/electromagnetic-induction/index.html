<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>전자기 유도</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-50 text-zinc-950">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-5 py-6 sm:px-8">
      <header class="mb-5">
        <p class="text-sm font-semibold text-rose-700">통합과학2 시연</p>
        <h1 class="mt-1 text-3xl font-bold tracking-normal sm:text-4xl">전자기 유도</h1>
        <p class="mt-3 max-w-3xl text-base leading-7 text-zinc-700">
          자석이 가까이 있기만 하면 전류가 흐를 것 같지만, 전류는 자석이 움직이며 자기장이 변할 때 생깁니다.
        </p>
      </header>

      <section class="grid flex-1 gap-4 lg:grid-cols-[1fr_320px]">
        <div class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm">
          <div class="relative h-[420px] overflow-hidden rounded-md border border-zinc-200 bg-gradient-to-b from-white to-rose-50">
            <div class="absolute left-1/2 top-1/2 h-40 w-24 -translate-x-1/2 -translate-y-1/2 rounded-full border-[10px] border-amber-600"></div>
            <div class="absolute left-[18%] top-1/2 flex h-20 w-36 -translate-y-1/2 overflow-hidden rounded-md border border-zinc-700 shadow">
              <div class="flex flex-1 items-center justify-center bg-red-600 text-xl font-bold text-white">N</div>
              <div class="flex flex-1 items-center justify-center bg-blue-700 text-xl font-bold text-white">S</div>
            </div>
            <div class="absolute right-12 top-16 h-28 w-28 rounded-full border-4 border-zinc-700 bg-white">
              <div class="absolute left-1/2 top-1/2 h-12 w-1 origin-bottom -translate-x-1/2 -translate-y-full rotate-0 rounded bg-rose-600"></div>
              <div class="absolute bottom-5 left-0 right-0 text-center text-xs font-bold text-zinc-600">전류계</div>
            </div>
            <div class="absolute left-6 bottom-4 text-sm font-semibold text-zinc-600">시각화 영역</div>
            <div class="absolute right-5 bottom-5 rounded-md bg-white/85 px-3 py-2 text-sm font-semibold text-zinc-700 shadow-sm">
              구현 예정: 움직일 때만 전류계 반응
            </div>
          </div>
        </div>

        <aside class="rounded-lg border border-zinc-200 bg-white p-4 shadow-sm">
          <h2 class="text-lg font-bold">시연 조작</h2>
          <div class="mt-4 grid gap-2">
            <button class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold">가까이 두기</button>
            <button class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold">천천히 넣기</button>
            <button class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold">빠르게 넣기</button>
            <button class="rounded-md border border-zinc-300 px-3 py-2 text-sm font-semibold">빼기</button>
          </div>

          <dl class="mt-5 space-y-3 text-sm">
            <div class="rounded-md bg-zinc-50 p-3">
              <dt class="font-semibold text-zinc-600">자석이 멈춰 있을 때</dt>
              <dd class="mt-1 text-xl font-bold">전류 0</dd>
            </div>
            <div class="rounded-md bg-zinc-50 p-3">
              <dt class="font-semibold text-zinc-600">자석이 움직일 때</dt>
              <dd class="mt-1 text-xl font-bold">전류 발생</dd>
            </div>
            <div class="rounded-md bg-rose-50 p-3">
              <dt class="font-semibold text-rose-800">관찰 포인트</dt>
              <dd class="mt-1 leading-6 text-zinc-700">가까움보다 변화가 중요합니다. 방향이 바뀌면 전류 방향도 바뀝니다.</dd>
            </div>
          </dl>
        </aside>
      </section>
    </main>
  </body>
</html>
